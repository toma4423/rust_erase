name: Test

on:
  # push:
  #   branches: [ main ] # release.yml でテストが実行されるため、ここでは無効化
  pull_request:
    branches: [ main ] # プルリクエスト時のみテストを実行

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run tests
        run: cargo test
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy -- -D warnings 