name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.calculate_version.outputs.new_version }}
      is_new_version: ${{ steps.calculate_version.outputs.is_new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calculate_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo $LATEST_TAG | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
          echo "New version: $NEW_VERSION"

          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LATEST_TAG HEAD)
            if [ -n "$CHANGES" ]; then
              echo "Changes detected since last tag"
              echo "is_new_version=true" >> $GITHUB_OUTPUT
            else
              echo "No changes detected since last tag"
              echo "is_new_version=false" >> $GITHUB_OUTPUT
            fi
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  build-and-release:
    needs: calculate-version
    if: needs.calculate-version.outputs.is_new_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Run Tests
        run: cargo test

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          version_tag_without_v=$(echo "${{ needs.calculate-version.outputs.new_version }}" | sed 's/^v//')
          asset_name="rust_erase_linux_x86_64_${version_tag_without_v}.tar.gz"
          cd target/x86_64-unknown-linux-gnu/release/
          chmod +x rust_erase
          tar czf "../../../${asset_name}" rust_erase
          echo "asset_path=${asset_name}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.calculate-version.outputs.new_version }}
          release_name: Release ${{ needs.calculate-version.outputs.new_version }}
          body: |
            Automated release based on push to main branch.
            Please update the release notes.
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.prepare_asset.outputs.asset_path }}
          asset_name: ${{ steps.prepare_asset.outputs.asset_path }}
          asset_content_type: application/gzip 